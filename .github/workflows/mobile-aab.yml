name: Mobile AAB (Play Store)

# Builds a signed Android App Bundle from mobile/ for upload to the Play
# Console. Separate from mobile-apk.yml on purpose: that one produces an
# unsigned-for-distribution, debug-keystore-signed APK for handing to
# testers directly; this one produces a properly upload-key-signed .aab,
# which is the only format the Play Store accepts and which — unlike the
# APK workflow — needs real release-signing secrets to exist at all.
#
# Required repo secrets (see mobile/README.md → "Play Store releases"):
#   GOOGLE_SERVICES_JSON     - same secret mobile-apk.yml uses
#   ANDROID_KEYSTORE_BASE64  - `base64 -w0 upload-keystore.jks`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# This workflow only ever builds and uploads the .aab as a downloadable
# artifact — it does not push to the Play Console. The very first release
# of a new app has to be uploaded by hand through the Play Console UI
# regardless (Google requires this); wiring automatic publishing for
# updates *after* that first manual upload is a small addition on top of
# this (e.g. r0adkll/upload-google-play) that needs a Play Developer API
# service account you'd create once the app exists in the console.

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name for this build (e.g. 1.0.0). Leave blank to use pubspec.yaml.'
        required: false
        type: string

defaults:
  run:
    working-directory: mobile

concurrency:
  group: mobile-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        # The hosted runner's SDK image doesn't pre-accept every license —
        # notably a newer platform (e.g. android-36) that a plugin's AAR
        # metadata requires but that hasn't been downloaded/licensed yet.
        # Gradle auto-installs missing SDK components during the build,
        # but only succeeds if the license is already accepted; this has
        # to run before any Gradle-invoking step.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          # Only the downloaded package archives — not all of ~/.pub-cache,
          # which can also hold pub's OAuth credentials file. A stale or
          # invalid cached credential there is enough to make an unrelated,
          # fully public package resolve as "Package not available
          # (authorization failed)" on a later run.
          path: ~/.pub-cache/hosted
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::Repo secret GOOGLE_SERVICES_JSON is not set (see mobile/README.md)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          python3 -c "import json; json.load(open('android/app/google-services.json'))"

      - name: Write release keystore and key.properties
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_B64" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$STORE_PASSWORD" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repo secret(s): ${missing[*]} — see mobile/README.md > Play Store releases."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install dependencies
        run: |
          if ! flutter pub get; then
            echo "::warning::flutter pub get failed — clearing the pub cache and retrying once, in case a cached package archive or credential is stale."
            rm -rf ~/.pub-cache/hosted
            flutter pub get
          fi

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Determine version name
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            name="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
            name="${GITHUB_REF#refs/tags/mobile-v}"
          else
            name="$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build AAB
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="$GITHUB_RUN_NUMBER"

      - name: Rename AAB
        id: aab
        run: |
          src="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$src" ]; then
            echo "::error::Expected AAB not found at $src"
            exit 1
          fi
          name="adya-mobile-${{ steps.version.outputs.name }}-$GITHUB_RUN_NUMBER.aab"
          cp "$src" "build/app/outputs/bundle/release/$name"
          echo "path=mobile/build/app/outputs/bundle/release/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.aab.outputs.name }}
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Clean up signing material
        if: always()
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks
